[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "risk-threshold-engine"
version = "0.1.0"
description = "Factor-score-driven market risk evaluation: composite score, regime classification, and deployment decisions."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["finance", "risk", "portfolio", "factor-investing"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repository = "https://github.com/BrainScanStudios/risk-threshold-engine"

[tool.pytest.ini_options]
testpaths = ["tests"]
